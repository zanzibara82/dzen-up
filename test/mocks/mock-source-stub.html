<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Подтвердите, что вы не робот</title>
<style>
  body { font: 16px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; margin: 40px; }
</style>
</head>
<body>
  <!-- Страница-заглушка: антибот отдаёт красивую страницу, но самой статьи на ней
       нет. Забрать оттуда нечего, и воркер обязан сказать об этом прямо, а не
       принести 150 знаков в редактор вместо текста. -->
  <div class="stub">
    <h1>Проверка соединения</h1>
    <p>Нам нужно убедиться, что запросы отправляете вы, а не программа.</p>
    <p>Включите JavaScript и обновите страницу.</p>
  </div>
  <script>
    // «Отложенный» контент. Вставляемся не по таймеру: тест ждёт состояние, а не
    // секунды, и гонка «успел скрипт или нет» сделала бы проверку случайной.
    // window.dzrRelease() дергает сам тест, чтобы увидеть обе половины правды:
    // до вставки статьи нет, после — есть, но воркер её уже не ждёт.
    window.dzrRelease = function () {
      var box = document.createElement("div");
      box.className = "article-late";
      box.innerHTML =
        "<p>Догруженный первый абзац: <strong>текст появился только после скрипта</strong> и до конца загрузки страницы его не было.</p>" +
        "<p>Догруженный второй абзац с достаточным объёмом слов, чтобы страница перешагнула порог длины и стала статьёй.</p>" +
        "<p>Догруженный третий абзац: <a href=\"https://auto-dom24.ru/obzor\">ссылка</a> и ещё несколько обычных предложений про подвеску, расход и стоимость обслуживания.</p>" +
        "<p>Догруженный четвёртый абзац, который дописан здесь специально: порога длины нужно коснуться двумя абзацами, а не одним.</p>" +
        "<p>Догруженный пятый абзац: вывод — страница стала статьёй, но случилось это уже после того, как мы смотрели на неё.</p>";
      document.body.appendChild(box);
    };
  </script>
</body>
</html>
