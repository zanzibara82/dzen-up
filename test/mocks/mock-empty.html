<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Лента Дзена — мок без редактора</title>
<style>
  body { font: 16px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #fff; color: #1a1a1a; }
  .feed { max-width: 720px; margin: 0 auto; padding: 32px 24px 160px; }
  .card { border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 8px; font-size: 18px; }
  /* поле поиска — редактируемое, но это НЕ редактор статьи */
  input[type="search"] { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; }
</style>
</head>
<body>
  <div class="feed">
    <h1>Лента</h1>
    <input type="search" placeholder="Поиск по Дзену" />
    <div class="card">
      <h3>Как выбрать кроссовер для города</h3>
      <p>Разбираем, чем отличаются полный привод и монопривод в ежедневной эксплуатации.</p>
    </div>
    <div class="card">
      <h3>Обзор Subaru Outback Wilderness</h3>
      <p>Дорожный просвет 9,5 дюйма, внедорожные шины и турбированный оппозитный двигатель.</p>
    </div>
  </div>
  <!-- никаких contenteditable и textarea: это страница чтения, а не редактор -->
</body>
</html>
