# Юнит-наборы на каждом пуше и в каждом pull request.
#
# Почему только юниты. Браузерные наборы (их 17) поднимают свой Chrome и держат
# порт из 8787–8799; в CI это сначала падает на отсутствующем профиле, потом на
# таймаутах CDP, и зелёным такой прогон не бывает. Полная регрессия остаётся
# локальной: `npm test`.
#
# Что здесь всё-таки проверяется. Разъезд README с константами кода (`docs`) —
# то, что раньше ловилось только глазами на выдаче, — и логику перевода,
# перелинковки, карты канала и забора текста (`reliability`, `links`, `channels`,
# `fetch`). Пять наборов, пара секунд, зависимостей нет: `npm install` не нужен.
name: юнит-наборы

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Наборы сверяют СОБРАННУЮ папку с исходниками, поэтому сборка обязательна.
      # Без zip: архив здесь некому смотреть, а лишняя запись на диск сбивает с
      # толку разбор упавшего прогона.
      - name: собрать папку расширения
        run: node tools/build-extension.cjs --no-zip

      # Путь собранной копии берётся по умолчанию (..\dzen-rewriter рядом с
      # репозиторием) — ровно туда её кладёт сборка.
      - name: юнит-наборы
        run: bash test/run-suite.sh --only docs,reliability,links,channels,fetch
